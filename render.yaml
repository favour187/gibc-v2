services:
  - type: web
    name: adaptive-learning-studio
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SEED_DEMO_USER
        value: "true"
      - key: TRUSTED_PROXY_HEADERS
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "240"
      - key: AI_MODE
        value: auto
      - key: AI_API_KEY
        sync: false
